name: Pacotes da extensao

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Gerar pacotes Chrome e Firefox
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          (cd chrome && zip -q -r "$GITHUB_WORKSPACE/baiak-jarvis-chrome-${TAG}.zip" .)
          (cd firefox && zip -q -r "$GITHUB_WORKSPACE/baiak-jarvis-firefox-${TAG}.zip" .)
      - name: Anexar pacotes ao release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "baiak-jarvis-chrome-${TAG}.zip" "baiak-jarvis-firefox-${TAG}.zip" --clobber
